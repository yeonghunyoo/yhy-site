<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f5f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161311" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // 첫 페인트 전에 테마 적용 (깜빡임 방지)
      (function () {
        try {
          var t = localStorage.getItem("nuvo-theme");
          if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          document.documentElement.dataset.theme = t;
          var a = localStorage.getItem("nuvo-accent");
          if (a === "sage" || a === "slate") document.documentElement.dataset.accent = a;
        } catch (e) {}
      })();
    </script>
    <title>nuvo</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
