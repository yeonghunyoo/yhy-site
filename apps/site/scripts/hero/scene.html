<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hero scene (local)</title>
<style>
  html, body { margin: 0; height: 100%; background: #0e0f11; }
  canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
  #p { position: fixed; left: 12px; bottom: 12px; width: calc(100% - 24px); }
</style>
<script type="importmap">
{ "imports": {
  "three": "/node_modules/three/build/three.module.js",
  "three/addons/": "/node_modules/three/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="c"></canvas>
<input id="p" type="range" min="0" max="1" step="0.001" value="0" aria-label="진행도">
<script type="module">
  // 로컬 미리보기·프레임 렌더용 셸. 쿼리: model(GLB 경로) cols levels aspect(예: 1.7778) preserve(1)
  import { createHero } from './scene.js';
  const q = new URLSearchParams(location.search);
  const num = (k) => (q.has(k) ? Number(q.get(k)) : undefined);
  const hero = createHero(document.getElementById('c'), {
    modelUrl: q.get('model'),
    cols: num('cols') ?? null,
    cell: num('cell') ?? 24,
    levels: num('levels') ?? 6,
    aspect: num('aspect') ?? null,
    preserve: q.get('preserve') === '1',
  });
  window.hero = hero;
  const fit = () => hero.resize(innerWidth, innerHeight);
  addEventListener('resize', fit);
  fit();
  const p = document.getElementById('p');
  p.addEventListener('input', () => hero.setProgress(+p.value));
  hero.ready.then(() => { window.heroReady = true; }, (e) => { window.heroError = String(e); });
</script>
</body>
</html>
